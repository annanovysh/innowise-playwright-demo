name: Playwright Tests Run & Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 26 (Oracle)
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      - name: Install Playwright Browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      # 1. Запускаем тесты (предполагаем, что у вас настроен Allure Maven/JUnit плагин и результаты пишутся в target/allure-results)
      - name: Run Maven Tests
        run: mvn test
        continue-on-error: true # Важно: если тесты упадут, мы всё равно хотим сгенерировать отчет Allure для анализа!

      # 2. Устанавливаем Java-утилиту для генерации Allure
      - name: Get Allure results
        uses: simple-elf/allure-action@master
        if: always()
        id: allure-report
        with:
          allure_results: 'target/allure-results' # Путь, куда ваши тесты складывают сырые данные Allure
          allure_report: 'target/allure-report'
          keep_reports: 20

      # 3. Публикуем отчет в виде Artifact, чтобы его можно было скачать из GitHub
      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-artifact
          path: target/allure-report
          retention-days: 30